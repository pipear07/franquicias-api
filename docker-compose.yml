version: "3.8"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db          # persistent volume

  api:
    build: .                         # use the root Dockerfile
    depends_on:
      - mongo
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/franquicias
    ports:
      - "8080:8080"

volumes:
  mongo_data:                        # declares the volume
